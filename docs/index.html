<!DOCTYPE html>
<html lang="en">

<head>
    <title>Displaying Surface Pressure Charts</title>

    <script type="text/javascript">

        async function createTable() {
            let w = 5; // up to 5-day forecasts. COLUMNS
            let h = 5; // number of old forecasts to compare against. ROWS

            let folderPath = "charts/";
            let today = new Date();

            // Determine whether to start Today at 00:00 (offset=0) or 12:00 (offset=1)
            let offset = 0;
            let now_hour = today.getUTCHours();
            if (now_hour > 19) {  // Should by synchronised with cronjob
                offset = 1;
            }
            else {
                offset = 0;
            }

            // mm and yyyy are derived per-day below to handle month/year rollover correctly

            let table = document.createElement('table');
            let headerRow = table.insertRow(0);
            for (let j = 0; j < h; j++) { // loop over forecast issue date

                let row = table.insertRow(-1);
                let labelCell = row.insertCell(0);
                labelCell.textContent = String(j);  // Insert row labels
                for (let i = 0; i < w; i++) { // loop over 24hr day

                    for (let k = 0; k < 2; k++) { // loop over 12hr cycle
                        let hh = String(((k + offset) % 2) * 12).padStart(2, '0');
                        // Compute the target date properly so month/year roll over correctly
                        let dayOffset = i + ((k + offset) >= 2 ? 1 : 0);
                        let targetDate = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate() + dayOffset));
                        let dd = String(targetDate.getUTCDate()).padStart(2, '0');
                        let mm = String(targetDate.getUTCMonth() + 1).padStart(2, '0');
                        let yyyy = String(targetDate.getUTCFullYear());
                        let datetime_str = yyyy + '-' + mm + '-' + dd + "T" + hh + ":00:00Z";
                        let filename = datetime_str + "_forecastperiod_" + (j + 2 * i + k) * 12 + ".gif";

                        let img = document.createElement("img");
                        img.src = folderPath + filename;
                        img.height = 150;
                        let td = row.insertCell(2 * i + k + 1);
                        img.addEventListener("error", () => img.remove(), { once: true });

                        // Insert column headers (dates)
                        if (j === 0) {
                            // Insert a blank header cell for the row label column (first column)
                            if (i === 0 && k === 0) {
                                const emptyTh = document.createElement("th");
                                emptyTh.scope = "col";
                                headerRow.appendChild(emptyTh);
                            }

                            let imageDate = new Date(filename.split("_")[0]);
                            let weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
                            let months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                            let th = document.createElement("th");
                            th.scope = "col";
                            th.textContent = weekdays[imageDate.getUTCDay()] + " " +
                                String(imageDate.getUTCDate()).padStart(2, "0") + " " +
                                months[imageDate.getUTCMonth()] + " " +
                                String(imageDate.getUTCHours()).padStart(2, "0") + ":" +
                                String(imageDate.getUTCMinutes()).padStart(2, "0") + "Z";
                            headerRow.appendChild(th);
                        }

                        if (1) {    // Add image to cell
                            td.appendChild(img);
                        }
                        else {    // Add text to the cell - debugging filenames
                            let newText = document.createTextNode(filename);
                            td.appendChild(newText);
                        }
                    }
                }
            }

            let issueText = "unknown";

            try {
                const response = await fetch("issue_timestamp.txt");
                if (!response.ok) throw new Error("issue_timestamp.txt not found");
                issueText = await response.text();
            } catch (err) {
                console.error("Could not load issue timestamp:", err);
            }

            let newRow2 = table.insertRow(-1);
            let newCell2 = newRow2.insertCell(0);
            newCell2.colSpan = 2 * w;
            newCell2.textContent = "Issue date: " + issueText.trim();

            document.body.appendChild(table);


            // Add link to repo
            let newRow = table.insertRow(-1); // Insert a row at the end of the table
            let newCell = newRow.insertCell(0); // Insert a cell in the row at index 0
            newCell.colSpan = 2 * w;

            // Create anchor element. 
            let a = document.createElement('a');
            // Append a text node to the cell
            let link = document.createTextNode("Return to code repo: github.com/jpolton/SynopticCharts");
            a.appendChild(link);
            a.title = "link to repo";
            a.href = "https://github.com/jpolton/SynopticCharts";
            newCell.appendChild(a);

            document.body.appendChild(table);

        }

        window.onload = createTable;

    </script>
</head>

<body>
</body>

</html>
