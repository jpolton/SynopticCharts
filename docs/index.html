<!DOCTYPE html>
<html lang="en">

<head>
    <title>Displaying Surface Pressure Charts</title>

    <script>
        async function createTable() {
            const columnsPerDay = 2;
            const days = 6;
            const folderPath = "charts/";

            try {
                // Load and validate the issue runs and their available forecast products.
                const response = await fetch("forecast_metadata.json");
                if (!response.ok) {
                    throw new Error(`Could not load forecast metadata (${response.status})`);
                }

                const forecasts = await response.json();
                if (!Array.isArray(forecasts) || forecasts.some(forecast =>
                    typeof forecast.issued !== "string" ||
                    !Number.isFinite(Date.parse(forecast.issued)) ||
                    !Array.isArray(forecast.products) ||
                    forecast.products.some(product =>
                        typeof product.target_date !== "string" ||
                        typeof product.forecast_lead !== "number"
                    )
                )) {
                    throw new Error("Forecast metadata has an invalid format");
                }

                // Put the newest issue first so the most recent run appears at the top.
                forecasts.sort((a, b) => Date.parse(b.issued) - Date.parse(a.issued));

                // Build six 12-hour target-time columns per day, starting with the next
                // scheduled cycle when today's late forecast has already been issued.
                const now = new Date();
                const offset = now.getUTCHours() > 19 ? 1 : 0;
                const columnDates = Array.from({ length: columnsPerDay * days }, (_, index) => {
                    const cycle = index + offset;
                    return new Date(Date.UTC(
                        now.getUTCFullYear(),
                        now.getUTCMonth(),
                        now.getUTCDate() + Math.floor(cycle / columnsPerDay),
                        (cycle % columnsPerDay) * 12
                    ));
                });

                // Add target-time headers, then one row per issue run.
                const table = document.createElement("table");
                const headerRow = table.createTHead().insertRow();
                const emptyHeader = document.createElement("th");
                emptyHeader.scope = "col";
                headerRow.appendChild(emptyHeader);

                const weekdays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
                const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
                for (const date of columnDates) {
                    const header = document.createElement("th");
                    header.scope = "col";
                    header.textContent = `${weekdays[date.getUTCDay()]} ${String(date.getUTCDate()).padStart(2, "0")} ${months[date.getUTCMonth()]} ${String(date.getUTCHours()).padStart(2, "0")}:00Z`;
                    headerRow.appendChild(header);
                }

                const tableBody = table.createTBody();
                for (const forecast of forecasts.slice(0, days)) {
                    const row = tableBody.insertRow();
                    const issueCell = document.createElement("th");
                    issueCell.scope = "row";
                    issueCell.textContent = forecast.issued;
                    row.appendChild(issueCell);

                    // Match each target-time column to its product; missing products leave
                    // an empty cell, while available ones determine their own image filename.
                    const productsByTargetDate = new Map(
                        forecast.products.map(product => [product.target_date, product])
                    );
                    for (const date of columnDates) {
                        const cell = row.insertCell();
                        const targetDate = date.toISOString().replace(".000Z", "Z");
                        const product = productsByTargetDate.get(targetDate);
                        if (!product) {
                            continue;
                        }

                        const image = document.createElement("img");
                        image.src = `${folderPath}${product.target_date}_forecastperiod_${product.forecast_lead}.gif`;
                        image.height = 150;
                        // Add blue border around Analysis plot
                        if (product.forecast_lead === 0) {
                            image.style.border = "2px solid blue";
                        }
                        image.addEventListener("error", () => image.remove(), { once: true });
                        cell.appendChild(image);
                    }
                }

                let issueText = "unknown";
                try {
                    const response = await fetch("issue_timestamp.txt");
                    if (!response.ok) {
                        throw new Error(`Could not load issue_timestamp.txt (${response.status})`);
                    }
                    const lines = (await response.text()).trim().split(/\r?\n/);
                    issueText = lines[lines.length - 1] || "unknown";
                } catch (error) {
                    console.error("Could not load issue timestamp:", error);
                }

                // Show the latest timestamp for issued forecast and page refresh
                const tableFooter = table.createTFoot();
                const issueRow = tableFooter.insertRow();
                const issueCell = issueRow.insertCell();
                issueCell.colSpan = columnsPerDay * days + 1;
                // split into 2 lines
                issueCell.textContent = issueText.replace("Page last updated", "\nPage last updated");
                issueCell.style.whiteSpace = "pre-line";

                // Show link to GitHub repo.
                const linkRow = tableFooter.insertRow();
                const linkCell = linkRow.insertCell();
                linkCell.colSpan = columnsPerDay * days + 1;
                const link = document.createElement("a");
                link.href = "https://github.com/jpolton/SynopticCharts";
                link.textContent = "Return to code repo: github.com/jpolton/SynopticCharts";
                linkCell.appendChild(link);
                document.body.appendChild(table);
            } catch (error) {
                // Report loading or data errors instead of showing an incomplete grid.
                console.error("Could not display forecast charts:", error);
                document.body.textContent = `Could not load forecast charts: ${error.message}`;
            }
        }

        window.addEventListener("load", createTable);
    </script>
</head>

<body>
</body>

</html>
